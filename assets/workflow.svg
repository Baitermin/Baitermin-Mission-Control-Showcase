<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="460" viewBox="0 0 1500 460"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b12"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="1500" height="460" rx="24" fill="url(#bg)"/><text x="60" y="72" fill="#fff" font-family="Arial" font-size="32" font-weight="700">Baitermin Mission Control</text><text x="60" y="105" fill="#71809a" font-family="Arial" font-size="15">Human-gated multi-agent content workflow</text><path d="M220 245 H1285" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/><g font-family="Arial"><g><circle cx="220" cy="245" r="62" fill="#101824" stroke="#2dd4bf" stroke-width="3"/><text x="220" y="239" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">BAITER</text><text x="220" y="266" text-anchor="middle" fill="#91a4bf" font-size="12">research + brief</text></g><g><circle cx="575" cy="245" r="62" fill="#101824" stroke="#22d3ee" stroke-width="3"/><text x="575" y="239" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">RENDER</text><text x="575" y="266" text-anchor="middle" fill="#91a4bf" font-size="12">video production</text></g><g><circle cx="930" cy="245" r="62" fill="#101824" stroke="#60a5fa" stroke-width="3"/><text x="930" y="239" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">VERIFYER</text><text x="930" y="266" text-anchor="middle" fill="#91a4bf" font-size="12">QA + privacy</text></g><g><circle cx="1285" cy="245" r="70" fill="#191429" stroke="#a78bfa" stroke-width="3"/><text x="1285" y="233" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">HUMAN</text><text x="1285" y="258" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">REVIEW</text><text x="1285" y="284" text-anchor="middle" fill="#a99bc3" font-size="11">approve ≠ publish</text></g><text x="397" y="226" text-anchor="middle" fill="#6ee7d7" font-size="12" font-weight="700">VALIDATED HANDOFF</text><text x="753" y="226" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="700">DRAFT + REPORT</text><text x="1108" y="226" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">VERDICT</text><rect x="1070" y="350" width="430" height="58" rx="16" fill="#101620" stroke="#253044"/><text x="1095" y="375" fill="#f5f7fb" font-size="13" font-weight="700">Safety-first by design</text><text x="1095" y="396" fill="#7c8ba3" font-size="11">No automatic publishing · privacy-aware media · explicit human gate</text></g></svg>